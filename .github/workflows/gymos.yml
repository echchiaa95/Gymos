name: GymOS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gymos-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Extract, Validate and Deploy GymOS
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Find ZIP
      # =========================================================
      - name: Find GymOS ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for GymOS ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo "Upload the GymOS ZIP file to the repository root."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "$ZIP_FILE" > zip_path.txt

      # =========================================================
      # 3. Extract ZIP
      # =========================================================
      - name: Extract GymOS
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(cat zip_path.txt)

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # =========================================================
      # 4. Locate app directory
      # =========================================================
      - name: Locate GymOS app
        shell: bash
        run: |
          set -e

          APP_DIR=$(find extracted \
            -type d \
            -name "app" \
            -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: GymOS app directory was not found."
            echo "The ZIP must contain an app/ directory."
            exit 1
          fi

          echo "GymOS app found:"
          echo "$APP_DIR"

          echo "$APP_DIR" > app_path.txt

      # =========================================================
      # 5. Validate project structure
      # =========================================================
      - name: Validate GymOS structure
        shell: bash
        run: |
          set -e

          APP_DIR=$(cat app_path.txt)

          echo "Checking GymOS structure..."

          REQUIRED_FILES=(
            "index.html"
            "entry.html"
            "manifest.webmanifest"
            "sw.js"
          )

          for file in "${REQUIRED_FILES[@]}"
          do
            if [ ! -f "$APP_DIR/$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          if [ ! -d "$APP_DIR/js" ]; then
            echo "ERROR: Missing js directory."
            exit 1
          fi

          if [ ! -d "$APP_DIR/css" ]; then
            echo "ERROR: Missing css directory."
            exit 1
          fi

          echo "GymOS structure is valid."

      # =========================================================
      # 6. Setup Node
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================================================
      # 7. Validate JavaScript
      # =========================================================
      - name: Validate JavaScript
        shell: bash
        run: |
          set -e

          APP_DIR=$(cat app_path.txt)

          echo "Checking JavaScript files..."

          JS_COUNT=0

          while IFS= read -r -d '' file
          do
            echo "Checking: $file"
            node --check "$file"
            JS_COUNT=$((JS_COUNT + 1))
          done < <(
            find "$APP_DIR" \
              -type f \
              -name "*.js" \
              -print0
          )

          echo "Checked $JS_COUNT JavaScript files."

          echo "JavaScript validation passed."

      # =========================================================
      # 8. Configure GitHub Pages
      # =========================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # =========================================================
      # 9. Prepare deployment
      # =========================================================
      - name: Prepare deployment
        shell: bash
        run: |
          set -e

          APP_DIR=$(cat app_path.txt)

          rm -rf deploy
          mkdir -p deploy

          cp -R "$APP_DIR"/. deploy/

          echo "Deployment directory:"
          find deploy -maxdepth 3 -type f | sort

      # =========================================================
      # 10. Upload Pages artifact
      # =========================================================
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

      # =========================================================
      # 11. Deploy
      # =========================================================
      - name: Deploy GymOS
        id: deployment
        uses: actions/deploy-pages@v4

      # =========================================================
      # 12. Show result
      # =========================================================
      - name: Deployment result
        run: |
          echo ""
          echo "=========================================="
          echo "       GymOS DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "GymOS URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "=========================================="
